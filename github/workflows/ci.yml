# CI — Run conformance tests on every push and pull request
# Tests both Node.js and Python implementations across multiple versions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run conformance tests
        run: npm test

      - name: Verify CLI
        run: |
          node cli/verify.mjs receipt examples/sample_receipt_valid.json
          node cli/verify.mjs receipt examples/sample_receipt_governed.json

      - name: Verify examples run
        run: |
          for f in examples/*.mjs; do
            echo "--- Running $f ---"
            node "$f"
          done

  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run conformance tests
        working-directory: python
        run: python tests/test_conformance.py

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package.json
        run: npm pack --dry-run

      - name: Check TypeScript declarations
        run: |
          npx tsc --noEmit --strict index.d.ts 2>&1 || true

      - name: Validate JSON samples
        run: |
          for f in examples/*.json; do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))"
          done
# Publish — Build and publish to npm and PyPI on version tags
# Triggered when a tag matching v*.*.* is pushed (e.g., v2.3.0).
# Requires repository secrets: NPM_TOKEN, PYPI_TOKEN

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Run full test suite before publishing
  test:
    name: Pre-publish Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Node.js conformance tests
        run: npm test

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python conformance tests
        working-directory: python
        run: python tests/test_conformance.py

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json' ).version)")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PACKAGE_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Verify version matches tag
        working-directory: python
        run: |
          PACKAGE_VERSION=$(python -c "import re; print(re.search(r'version\s*=\s*\"(.+?)\"', open('pyproject.toml').read()).group(1))")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: pyproject.toml version ($PACKAGE_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      - name: Build package
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        working-directory: python
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
# Docker — Build and push Docker image on version tags
# Publishes to GitHub Container Registry (ghcr.io).
# Also builds on pushes to main for testing (no push).

name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: |
          docker build -t rio-receipt-protocol:test .
          docker run --rm rio-receipt-protocol:test npm test
          docker run --rm rio-receipt-protocol:test rio-verify receipt /app/examples/sample_receipt_valid.json
          echo "Docker image tests passed"
